<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- fonts: Fraunces and Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  

  <!-- font awesome for icons  -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />   


</head>
<body>

  <main> 
    <article class="product-preview-card">
      <img src="./images/image-product-mobile.jpg" alt="Chanel Gabrielle Essence Eau de Parfum bottle">
      <div class="content">
        <div class="product-info">

          <span class="product-category">Perfume</span>
          <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>
          <p class="product-details">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
            Perfumer-Creator for the House of CHANEL.</p>
        </div>

        <div class="price">
          <strong>$149</strong>
          <del>$169</del>
        </div>

        <button class="cta-btn">
          <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
          <span>Add to Cart</span>
        </button>
      </div>
    </article>
  </main>

   
   
</body>
</html>
